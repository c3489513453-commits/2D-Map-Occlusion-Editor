<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="本地运行的地图元素识别、蒙版修整与透明素材导出工具">
  <title>地图抠图工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131a26'/%3E%3Cpath d='M7 23V9l8-3 10 4v14l-10 2z' fill='none' stroke='%2363d5e6' stroke-width='2'/%3E%3Cpath d='M15 6v20M25 10l-10 4-8-5' stroke='%2363d5e6' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◇</span><strong>地图抠图</strong><span id="save-state" class="save-state">已保存</span></div>
    <nav class="toolbar" aria-label="项目工具">
      <button id="new-project">新建项目</button><button id="open-project">打开项目</button>
      <button id="import-image">导入图片</button><button id="import-folder">导入文件夹</button>
      <input id="character-file" type="file" accept="image/png" hidden><button id="import-character">导入小人</button><button id="delete-character" title="显示小人右上角的删除按钮">删除小人</button><label class="character-scale" title="小人显示大小">大小 <input id="character-scale" type="range" min="10" max="300" value="100"></label><button id="auto-baselines">自动底线</button><button id="auto-walkable-boundaries">自动可走</button><button id="preview-mode">预览</button>
      <span class="divider"></span><button id="undo" title="Ctrl+Z">撤销</button><button id="redo">重做</button>
      <button id="save" class="primary" title="Ctrl+S">保存</button>
    </nav>
  </header>

  <main class="workspace">
    <aside class="maps-panel panel">
      <div class="panel-heading"><h2>地图</h2><span id="map-count" class="count">0</span></div>
      <div id="map-list" class="map-list"></div>
      <div id="map-empty" class="empty-state"><span class="empty-icon">▧</span><p>还没有地图</p><small>导入单张图片或整个文件夹开始</small></div>
    </aside>

    <section class="editor">
      <div class="recognition-bar">
        <label for="prompt">要识别的物体</label>
        <input id="prompt" placeholder="例如：chair. wooden door. stone wall." autocomplete="off">
        <label class="threshold">阈值 <input id="threshold" type="number" min="0.05" max="0.9" step="0.05" value="0.4"></label>
        <button id="detect" class="accent">开始识别</button>
      </div>
      <div id="canvas-shell" class="canvas-shell">
        <div id="canvas-empty" class="canvas-empty"><div class="canvas-symbol">＋</div><h1>导入地图开始抠图</h1><p>识别结果会自动成为独立图层</p></div>
        <div id="canvas-stage" class="canvas-stage" hidden><img id="map-image" alt="当前地图"><canvas id="mask-canvas"></canvas></div>
      </div>
      <div id="edit-actions" class="manual-actions edit-actions" hidden>
        <span id="edit-label">正在编辑</span>
        <button id="close-lasso" class="accent" type="button">闭合套索</button>
        <button id="cancel-lasso" type="button">取消这一笔</button>
        <button id="finish-edit" type="button">结束编辑</button>
      </div>
      <div id="manual-actions" class="manual-actions" hidden>
        <label>图层名称 <input id="manual-name" value="object"></label>
        <button id="generate-mask" class="accent">生成蒙版</button>
        <button id="commit-mask" class="primary" hidden>建立图层</button>
        <button id="cancel-mask">取消</button>
      </div>
      <div class="bottom-tools" role="toolbar" aria-label="画布工具">
        <button data-tool="select" class="active" title="点击蒙版选择图层，拖动小人测试位置">↖ 选择与移动</button><button data-tool="box" title="没在编辑图层时，框选用来生成新蒙版；正在编辑时，会识别方框里的区域并加进当前图层">框选</button>
        <button data-tool="positive">正点</button><button data-tool="negative">负点</button>
        <button id="walkable-brush" data-tool="brush" hidden>画笔</button><button data-tool="eraser">橡皮</button><button id="draw-line-tool" data-tool="occlusion" title="进入线条编辑后，左键增加节点，右键完成">画底线</button>
        <button data-tool="lasso-add">套索增加</button><button data-tool="lasso-subtract">套索减去</button>
        <span class="spacer"></span><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">＋</button>
      </div>
    </section>

    <aside class="layers-panel panel">
      <div class="panel-heading"><div id="layer-mode" class="layer-mode" aria-label="图层类型"><button type="button" data-mode="resources" class="active">资源蒙版</button><button type="button" data-mode="walkable">行走区域</button></div><span id="resource-heading-actions" class="heading-actions"><button id="add-layer" class="icon-button" title="先新建一个空图层，再用画笔涂">＋ 图层</button><button id="add-folder" class="icon-button" title="新建文件夹">＋ 文件夹</button></span></div>
      <div class="layer-actions"><button id="merge">合并选中</button><button id="export-selected">导出</button></div>
      <div id="layer-tree" class="layer-tree"></div>
      <div id="layer-empty" class="empty-state compact"><p>点「＋ 图层」先建空图层，再用画笔涂<br>或识别后显示在这里</p></div>
    </aside>
  </main>

  <footer class="statusbar"><span id="status-dot"></span><span id="status">准备就绪</span><span class="spacer"></span><span>仅在本机运行</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="export-dialog">
    <form method="dialog"><div class="dialog-heading"><h2>导出透明素材</h2><button type="button" data-close aria-label="关闭">×</button></div>
      <label>导出范围<select name="scope"><option value="selected">选中图层</option><option value="visible">当前地图可见图层</option><option value="all">当前地图全部图层</option><option value="project">整个项目</option></select></label>
      <fieldset><legend>图片尺寸</legend><label><input type="radio" name="mode" value="tight" checked> 紧凑裁剪（素材多大就导出多大）</label><label><input type="radio" name="mode" value="full_size"> 保持原图尺寸（其余位置透明）</label></fieldset>
      <label class="check"><input type="checkbox" name="include_occlusion"> 导出遮挡与行走配置 JSON（遮挡图和行走图保持原图尺寸）</label>
      <label>输出文件夹<input name="output_dir" placeholder="留空则使用项目的 exports 文件夹"></label>
      <label class="check"><input type="checkbox" name="include_hidden" checked> 包含隐藏图层</label><label class="check"><input type="checkbox" name="preserve_folders"> 保留图层文件夹结构</label>
      <div class="export-result" hidden></div><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">开始导出</button></div>
    </form>
  </dialog>
  <script type="module" src="/static/app.js?v=resource-walkability1"></script>
</body>
</html>
